# Render blueprint for the FastAPI backend (free tier). Runs from the repo root (no rootDir): the backend imports analyzer.py, rules.py and data/ from there. In Render: New > Blueprint > this repo,
# then set GROQ_API_KEY (from console.groq.com) in the service's Environment tab.
# The AI modes need Groq's Developer tier: each call sends ~8k-14k tokens and the free tier allows 6,000 tokens a
# minute per model, so on the free tier every AI review fails (413) and the site shows the rules-only report.
services:
  - type: web
    name: atliq-contract-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: GROQ_API_KEY
        sync: false
      # Callers of the AI modes must send this in X-Access-Token. Render generates it; copy it from the
      # Environment tab into the site's Settings box.
      - key: ATLIQ_ACCESS_TOKEN
        generateValue: true
      - key: ATLIQ_RATE_LIMIT_PER_HOUR
        value: "10"
      - key: ATLIQ_DAILY_LLM_LIMIT
        value: "200"
      - key: ATLIQ_CORS_ORIGINS
        value: https://satishj12.github.io
